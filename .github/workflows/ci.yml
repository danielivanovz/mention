name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-size:
    name: build · types · tests · docs · size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build and check library, example, and docs types
        run: bun run type-check
      - run: bun run test
      - run: bun run size
      - name: Build docs against the package
        run: cd apps/docs && bun run build

  e2e:
    name: browser behavior · caret geometry · axe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install browser
        run: cd packages/react && bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: Check caret geometry
        run: cd packages/react && bun run test:browser
      - name: Upload browser report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: packages/react/playwright-report/
          retention-days: 7
