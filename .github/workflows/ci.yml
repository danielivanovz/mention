name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-size:
    name: build · type-check · test · size
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/react
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run type-check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Enforce bundle budget
        run: bun run size

  e2e:
    name: e2e · axe (chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/react
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # --with-deps installs the system libraries Chromium needs on the
      # ubuntu runner. Skipping this is the #1 cause of "browserType
      # launch failed" CI flakes.
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright (contract + axe)
        run: bun run test:e2e

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: packages/react/playwright-report/
          retention-days: 7
